services:
  setup:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app
    volumes:
      - ./:/app
      - root_node_modules:/app/node_modules
    command: yarn install
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app/backend
    volumes:
      - ./:/app
      - root_node_modules:/app/node_modules
      - wrangler-local-state:/app/backend/.wrangler
    ports:
      - "3002:3002"
    depends_on:
      setup:
        condition: service_completed_successfully
    command: yarn dev
  bff:
    build:
      context: .
      dockerfile: bff/Dockerfile
    working_dir: /app/bff
    volumes:
      - ./:/app
      - root_node_modules:/app/node_modules
      - wrangler-bff-state:/app/bff/.wrangler
    ports:
      - "3001:3001"
    depends_on:
      setup:
        condition: service_completed_successfully
      backend:
        condition: service_started
    command: yarn dev
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    working_dir: /app/frontend
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - root_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      setup:
        condition: service_completed_successfully
      bff:
        condition: service_started
    command: yarn dev --host
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "1025:1025" # SMTP ポート
      - "8025:8025" # Web UI / HTTP API ポート

volumes:
  wrangler-local-state:
  wrangler-bff-state:
  root_node_modules:
